name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-sdk:
    name: Build SDK
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build SDK (macOS + iOS)
        run: |
          swift build -c release

      - name: Run tests
        # Skip 2 tests known to fail in CI sandbox: they need real Secure
        # Enclave/keychain access-control (auth(message: "Failed to generate
        # key pair")), which requires Xcode 26.4+; this runner only has
        # Xcode 26.3. Tracked as task #240. Revert this skip once the
        # macos-26 runner image ships Xcode 26.4+.
        run: >
          swift test
          --skip SirosAuthTests.LocalAuthProviderTests/testRollbackDeletesThePersistedKeychainKey
          --skip SirosAuthTests.LocalAuthProviderTests/testRegisteredKeyIsGatedByAccessControlRequiringUserPresence

      - name: Collect SDK artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts
          # Package source for SPM consumers (Package.swift + Sources/)
          tar czf "release-artifacts/siros-sdk-swift-${VERSION}-source.tar.gz" \
            Package.swift Sources/ README.md LICENSE
          # SPM build products (if available)
          if [ -d ".build/release" ]; then
            tar czf "release-artifacts/siros-sdk-swift-${VERSION}-build.tar.gz" \
              -C .build/release . 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-artifacts
          path: release-artifacts/

  build-sample-app:
    name: Build Sample App
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: SampleApp
        run: xcodegen generate

      - name: Resolve simulator device
        working-directory: SampleApp
        run: |
          # A concrete (bootable) simulator - not the generic destination
          # this job used to build against - is required here: zk_cred_vegaFFI's
          # XCFramework (siros-sdk-swift#182) only ships arm64 iOS Simulator
          # slices (zk-cred-vega's halo2curves dependency can't cross-compile
          # for legacy x86_64 iOS Simulator at all - see that crate's
          # Makefile), and a *generic* iOS Simulator destination builds every
          # architecture the platform considers valid for distribution,
          # x86_64 included, which this runner (Apple Silicon, like every
          # GitHub-hosted macos-26 image) never actually needs. A concrete
          # destination builds only the architecture that destination's
          # simulator actually runs - same fix as swift.yml's `build-sample-app`
          # job (Copilot review, PR #182: this release workflow was missed
          # when that job was fixed, so release builds stayed broken even
          # though regular CI was green).
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro( Max)?| Air|e)?' | sed -E 's/[[:space:]]+$//')
          echo "DEVICE=${DEVICE}" >> "$GITHUB_ENV"

      - name: Build Sample App (iOS Simulator)
        working-directory: SampleApp
        run: |
          xcodebuild build \
            -project SirosSampleApp.xcodeproj \
            -scheme SirosSampleApp \
            -destination "platform=iOS Simulator,name=${DEVICE}" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -20

      - name: Collect sample app artifacts
        run: |
          mkdir -p release-artifacts
          # Find the .app in DerivedData build output
          APP_PATH=$(find SampleApp/build -name "*.app" -path "*Debug*" | head -1)
          if [ -n "$APP_PATH" ]; then
            zip -r "release-artifacts/SirosSampleApp-${{ github.ref_name }}.zip" "$APP_PATH"
          else
            echo "Warning: No .app found in build output"
            find SampleApp/build -name "*.app" 2>/dev/null || echo "No .app files at all"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: sample-app-artifacts
          path: release-artifacts/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-sdk, build-sample-app]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f

      # Attaching the artifacts is the flakiest step in this workflow: it has
      # failed on consecutive releases, once with an HTML error page mid-upload
      # and once with "Error creating asset temp dir", both from the runner
      # rather than from anything here. v0.12.0 landed with one of its four
      # assets until the job was re-run by hand. Retry before giving up.
      # Each attempt is scoped to the previous attempt's OUTCOME, not to
      # `failure()`, so a failure anywhere else in the job (the artifact
      # download, say) does not trigger a pointless re-upload. The earlier
      # attempts carry continue-on-error so that a flake does not mark the
      # job failed once a later one has succeeded - v0.12.0 uploaded all
      # four assets on a retry and still reported failure. The last attempt
      # has no continue-on-error, so a genuine, persistent failure still
      # fails the job. Two retries rather than one because v0.12.0 flaked
      # twice within a single run.
      - name: Create GitHub Release
        id: release
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry the release upload (1)
        id: release_retry_1
        if: steps.release.outcome == 'failure'
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry the release upload (2)
        if: steps.release_retry_1.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
