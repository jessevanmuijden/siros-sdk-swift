name: Swift CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  test-macos:
    name: Test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build & Test with Coverage
        # Skip 2 tests known to fail in CI sandbox: they need real Secure
        # Enclave/keychain access-control (auth(message: "Failed to generate
        # key pair")), which requires Xcode 26.4+; this runner only has
        # Xcode 26.3. Tracked as task #240. Revert this skip once the
        # macos-26 runner image ships Xcode 26.4+.
        run: >
          swift test --parallel --enable-code-coverage
          --skip SirosAuthTests.LocalAuthProviderTests/testRollbackDeletesThePersistedKeychainKey
          --skip SirosAuthTests.LocalAuthProviderTests/testRegisteredKeyIsGatedByAccessControlRequiringUserPresence
      - name: Check coverage gate
        env:
          COVERAGE_MIN_PCT: "25"
        run: |
          # Use swift test's built-in coverage JSON output
          CODECOV_PATH=$(swift test --show-codecov-path 2>/dev/null || true)
          if [ -z "$CODECOV_PATH" ] || [ ! -f "$CODECOV_PATH" ]; then
            echo "Warning: could not find codecov JSON, skipping coverage gate"
            exit 0
          fi
          # Extract line coverage percentage from the totals
          PCT=$(python3 -c "import json; d=json.load(open('$CODECOV_PATH')); print(f\"{d['data'][0]['totals']['lines']['percent']:.1f}\")")
          echo "Line coverage: ${PCT}%"
          echo "Required minimum: ${COVERAGE_MIN_PCT}%"
          if (( $(echo "$PCT < $COVERAGE_MIN_PCT" | bc -l) )); then
            echo "::error::Coverage gate failed: ${PCT}% < ${COVERAGE_MIN_PCT}%"
            exit 1
          fi
      - name: Convert coverage to lcov
        if: always()
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          PROFDATA=$(find "$BIN_PATH" -name 'default.profdata' -type f | head -1)
          XCTEST=$(find "$BIN_PATH" -name '*.xctest' -type d | head -1)/Contents/MacOS/*
          if [ -n "$PROFDATA" ]; then
            xcrun llvm-cov export -format=lcov -instr-profile "$PROFDATA" $XCTEST \
              -ignore-filename-regex='\.build/|Tests/' > coverage.lcov
          fi
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          flags: macos
          fail_ci_if_error: false

  build-ios:
    name: Build (iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build for iOS Simulator
        run: |
          swift build \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            --triple arm64-apple-ios18.0-simulator

  # The SwiftPM unit tests on an iOS Simulator. `Test (macOS)` runs them on the host, where everything that is
  # `#if os(iOS)` (the shared DCQL engine's call site, among others) is compiled OUT, and `Build (iOS)` only
  # compiles. Without this job an iOS-only test or a regression in iOS-only code is never run in CI.
  test-ios-simulator:
    name: Test (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Resolve simulator device
        run: |
          # A concrete, bootable device (see the Sample App job for why not the generic destination).
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro( Max)?| Air|e)?' | sed -E 's/[[:space:]]+$//')
          echo "DEVICE=${DEVICE}" >> "$GITHUB_ENV"
      - name: Test on iOS Simulator
        # Tests skipped here fail ONLY on iOS today and are tracked, not deleted (the list is the whole of them;
        # a new iOS failure fails the job):
        #  - SirosAuthTests LocalAuthProviderTests (2): need real Secure Enclave / keychain access control, as
        #    the same skip in `Test (macOS)`.
        #  - SirosCredentialsTests CredentialMatcherTests (3) and SirosWalletTests
        #    SirosWalletCredentialSelectionDcqlIntegrationTests (4) + SirosWalletDCAPITests (1): they assert the
        #    built-in matcher's answer for fixtures whose raw credentials the iOS-only shared DCQL engine
        #    cannot read, so the engine answers differently. Test-fixture problem, not a product bug;
        #    tracked in the issue linked from this PR.
        run: >
          xcodebuild test
          -scheme SirosSDK-Package
          -destination "platform=iOS Simulator,name=${DEVICE}"
          CODE_SIGNING_ALLOWED=NO
          -skip-testing:SirosAuthTests/LocalAuthProviderTests/testRegisteredKeyIsGatedByAccessControlRequiringUserPresence
          -skip-testing:SirosAuthTests/LocalAuthProviderTests/testRollbackDeletesThePersistedKeychainKey
          -skip-testing:SirosCredentialsTests/CredentialMatcherTests/testMatchDcqlReturnsFullOutputWithCredentialSets
          -skip-testing:SirosCredentialsTests/CredentialMatcherTests/testMatchedCredentialIdsAreDistinct
          -skip-testing:SirosCredentialsTests/CredentialMatcherTests/testMatchFiltersByFormatAndVct
          -skip-testing:SirosWalletTests/SirosWalletCredentialSelectionDcqlIntegrationTests/testDcqlQueryFromPayload_filtersByDoctype
          -skip-testing:SirosWalletTests/SirosWalletCredentialSelectionDcqlIntegrationTests/testDcqlQueryFromPayload_zkFormat_matchesOrdinaryMdocAndParsesZkMeta
          -skip-testing:SirosWalletTests/SirosWalletCredentialSelectionDcqlIntegrationTests/testZkRequestedIds_plainQueryFirst_isNotZk
          -skip-testing:SirosWalletTests/SirosWalletCredentialSelectionDcqlIntegrationTests/testZkRequestedIds_zkQueryFirst_isZk
          -skip-testing:SirosWalletTests/SirosWalletDCAPITests/testHandleDCAPIRequestCredentialMatchingBothZkAndPlainQueryUsesFirstMatchForZkFlag

  bridge-vocabulary:
    name: Bridge capability vocabulary matches siros-sdk-kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # spec/bridge-capabilities.json is owned by siros-sdk-kotlin; this repo
      # carries a copy so the Swift twin is generated from the same file. Two
      # checks: the copy is byte-identical to the Kotlin repo's main, and the
      # generated Swift is current. Regenerate with
      #   tools/gen_bridge_capabilities.py --spec spec/bridge-capabilities.json \
      #     --only swift --swift-out Sources/SirosTransport/BridgeCapabilities.swift
      - name: Spec copy matches siros-sdk-kotlin main
        run: |
          curl -sSfL -o /tmp/upstream.json \
            https://raw.githubusercontent.com/sirosfoundation/siros-sdk-kotlin/main/spec/bridge-capabilities.json
          curl -sSfL -o /tmp/upstream_gen.py \
            https://raw.githubusercontent.com/sirosfoundation/siros-sdk-kotlin/main/tools/gen_bridge_capabilities.py
          diff -u /tmp/upstream.json spec/bridge-capabilities.json
          diff -u /tmp/upstream_gen.py tools/gen_bridge_capabilities.py
      - name: Generated Swift is current
        run: |
          python3 tools/gen_bridge_capabilities.py --check --spec spec/bridge-capabilities.json \
            --only swift --swift-out Sources/SirosTransport/BridgeCapabilities.swift

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    # Deliberately older than the toolchain this is developed on, so that a
    # construct only the newer type-checker can handle is caught here rather
    # than by whoever next builds on an older Swift. 6.2 is the floor set by
    # swift-crypto 5, which declares tools version 6.2.0.
    container: swift:6.2
    steps:
      - uses: actions/checkout@v7
      - name: Build & Test
        run: |
          # SirosKeystore, SirosFlow, SirosWallet depend on Apple-only frameworks
          # Only build and test platform-independent targets on Linux
          swift build --target SirosCredentials --target SirosTransport --target SirosAuth
          swift test --filter "SirosCredentialsTests|SirosTransportTests|SirosAuthTests" --parallel

  build-sample-app:
    name: Build Sample App
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: SampleApp
        run: xcodegen generate
      - name: Resolve simulator device
        working-directory: SampleApp
        run: |
          # A concrete (bootable) simulator - not the generic destination
          # this job used to build against - is required both here and for
          # the test step below. Select from actually available simulator
          # devices (not `simctl list devicetypes`, which lists templates
          # that may not correspond to a real device instance on every
          # runner image).
          #
          # The generic destination used to suffice for `build` (it doesn't
          # need a bootable simulator), but zk_cred_vegaFFI's XCFramework
          # (siros-sdk-swift#182) only ships arm64 iOS Simulator slices -
          # zk-cred-vega's halo2curves dependency can't cross-compile for
          # legacy x86_64 iOS Simulator at all (see that crate's Makefile) -
          # and a *generic* iOS Simulator destination builds every
          # architecture the platform considers valid for distribution,
          # x86_64 included, which this runner (Apple Silicon, like every
          # GitHub-hosted macos-26 image) never actually needs. A concrete
          # destination builds only the architecture that destination's
          # simulator actually runs.
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro( Max)?| Air|e)?' | sed -E 's/[[:space:]]+$//')
          echo "DEVICE=${DEVICE}" >> "$GITHUB_ENV"
      - name: Build for iOS Simulator
        working-directory: SampleApp
        run: |
          xcodebuild build \
            -project SirosSampleApp.xcodeproj \
            -scheme SirosSampleApp \
            -destination "platform=iOS Simulator,name=${DEVICE}" \
            CODE_SIGNING_ALLOWED=NO
      - name: Run Sample App unit tests
        working-directory: SampleApp
        run: |
          xcodebuild test \
            -project SirosSampleApp.xcodeproj \
            -scheme SirosSampleApp \
            -destination "platform=iOS Simulator,name=${DEVICE}" \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint

  docs:
    name: Documentation
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build DocC documentation
        run: |
          for target in SirosWallet SirosTransport SirosAuth SirosKeystore SirosFlow SirosCredentials; do
            echo "Building docs for $target..."
            swift package generate-documentation --target "$target"
          done
